name: Generate stats cards

# Renders the GitHub stats + top-languages cards as static SVGs using the
# github-readme-stats codebase, published to the `stats` branch. The README
# points there instead of the shared github-readme-stats.vercel.app instance,
# which now whitelists usernames and breaks for everyone else.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Check out github-readme-stats
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          ref: 54a7985aeefda00d5eadb55b80c17c7f976c37d2
          path: grs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install github-readme-stats dependencies
        working-directory: grs
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Render cards
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
          GRS_DIR: grs
          OUT_DIR: dist
        run: node scripts/render-stats-cards.mjs

      - name: Push to stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
